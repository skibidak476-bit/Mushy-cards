<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><title>Mushy Cards</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:#5a3a1e;font-family:'Trebuchet MS',Verdana,sans-serif;color:#fff}

.card{width:31%;background:#fff;color:#222;border-radius:12px;border:4px solid #4a8f2a;padding:4px;text-align:center;position:relative;overflow:hidden;transition:transform .1s}

.ov{position:absolute;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;font-size:28px;font-weight:900;text-align:center;padding:20px}
.ov .btn{width:70%}
.lock{filter:grayscale(1);opacity:.55}
.cd{inset:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;color:#fff}
.rl{font-size:30px;display:inline-block;animation:spin 1.2s linear infinite}

.ready{animation:rd .9s}
.pill{background:linear-gradient(#5a3a1e,#2e1b0c);border:2px solid #c8923f;box-shadow:inset 0 2px 0 #fff3,0 3px 0 #0006;border-radius:14px}
.stage{background:linear-gradient(#46c046,#1d7a1d);box-shadow:0 5px 0 #0006}
.stage small{background:linear-gradient(#ffe86a,#f2b823);border-radius:0 0 10px 10px}
.paper{background:#fff;border-color:#8fe0f0;box-shadow:0 8px 0 #0006,0 0 0 4px #fff}
.btn{background:linear-gradient(#fff07a,#ffc61f 60%,#ffb000);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b55a00}
.card{background:linear-gradient(160deg,#fff,#dff3c9);border-radius:14px;box-shadow:0 5px 0 #0005,inset 0 0 0 2px #ffffff99}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,#fff8 0,#fff0 38%);pointer-events:none}
.card .em{width:64px;margin:2px auto;border-radius:50%;line-height:1.3;background:radial-gradient(circle,#fff9,#7fc95f77);filter:drop-shadow(0 3px 2px #0005)}
.card.en{background:linear-gradient(160deg,#fff,#f4cccc)}
.card.sel{border-color:#ffd400;box-shadow:0 0 18px 5px #ffd400,0 5px 0 #0005}
.card.tg{animation:tg .8s infinite alternate;cursor:crosshair}
@keyframes tg{to{box-shadow:0 0 16px 4px #ff3b3b,0 5px 0 #0005}}
.card.hit{animation:sh .3s;filter:brightness(1.7) saturate(1.6)}
.bar{height:11px;border:2px solid #0006;background:#400}
.bar i{box-shadow:inset 0 2px 0 #fff6}
.fl{position:absolute;left:0;right:0;top:35%;text-align:center;color:#fff;font-weight:900;font-size:28px;z-index:3;text-shadow:-2px 0 #c00,2px 0 #c00,0 2px #c00,0 -2px #c00;animation:fl .9s forwards;pointer-events:none}
@keyframes fl{to{top:-5%;opacity:0}}
.turn{background:linear-gradient(90deg,#0000,#0008 20%,#0008 80%,#0000);padding:6px 0;font-size:17px;color:#9fff9f}
.turn.foe{color:#ff9f9f}
.item{background:linear-gradient(#5a3a1e,#38220f);border:2px solid #c8923f;box-shadow:0 4px 0 #0006}
.ov{animation:pop .4s;background:radial-gradient(#000a,#000d);text-shadow:0 0 18px #ffd400,0 3px 0 #000}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.bob{animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-7px)}}
.mc{width:14.5%;background:linear-gradient(#fff,#dff3c9);color:#222;border-radius:8px;padding:2px;text-align:center;font-size:10px;border:2px solid #b33;box-shadow:0 3px 0 #0005}
.mc .em2{font-size:24px}
.mc.pk{border-color:#3a3}
.mc.ow{border-color:#4a8f2a;width:22%}
.mc.empty{background:#0004;border:2px dashed #fff8;color:#fff;font-size:22px;padding:14px 0}
#app{box-shadow:inset 0 0 80px #0009}
@keyframes rd{0%,100%{box-shadow:0 0 0 #0000}50%{box-shadow:0 0 18px 8px #ffe34d;transform:scale(1.07)}}
.die{animation:die .7s forwards;pointer-events:none}
@keyframes die{0%{filter:none}25%{transform:scale(1.1);filter:brightness(3)}100%{transform:scale(.3) rotate(25deg) translateY(40px);opacity:0;filter:grayscale(1)}}
.fire{position:absolute;top:0;right:1px;font-size:26px;z-index:4;pointer-events:none;filter:drop-shadow(0 0 6px #ff8a00);animation:fw .45s ease-in-out infinite alternate}
.fire.b{filter:hue-rotate(195deg) saturate(2.2) drop-shadow(0 0 6px #2a8cff)}
@keyframes fw{from{transform:scale(.9) rotate(-8deg)}to{transform:scale(1.2) rotate(8deg)}}
.card.fo{outline:3px solid #ff8a00;outline-offset:-1px}
.card.fb{outline:3px solid #2a8cff;outline-offset:-1px}
.paper{padding:0;overflow:hidden;border:8px solid #6b4423;border-radius:8px;box-shadow:0 8px 0 #0006,inset 0 0 0 3px #d9b98a}
.cl{animation:dr 26s linear infinite}@keyframes dr{from{transform:translateX(-60px)}to{transform:translateX(420px)}}
.road{stroke-dasharray:6 10;animation:mr 1s linear infinite}@keyframes mr{to{stroke-dashoffset:-16}}
.pulse{animation:pl 1.3s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pl{from{transform:scale(.5);opacity:.9}to{transform:scale(2.4);opacity:0}}
.sec{margin:14px 0 6px;padding:6px 14px;background:linear-gradient(90deg,#d9a24a,#8a5a2b);border-radius:20px;display:inline-block;font-weight:900;text-shadow:0 2px 0 #0006;box-shadow:0 3px 0 #0005}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk2{border-radius:16px;padding:10px 8px;text-align:center;border:3px solid #fff8;box-shadow:0 5px 0 #0006,inset 0 0 30px #fff3}
.pk2 .ic{font-size:50px;animation:fl2 2.4s ease-in-out infinite alternate;filter:drop-shadow(0 5px 3px #0006)}

.pk2 b{display:block;font-size:15px;text-shadow:0 2px 0 #0007}.pk2 small{display:block;font-size:11px;min-height:30px;margin-bottom:6px}
.pk2.lk{filter:grayscale(.9) brightness(.7)}
.buy{width:100%;border:0;border-radius:10px;padding:9px 4px;font-weight:900;font-size:15px;color:#4a3300;background:linear-gradient(#fff07a,#ffb000);box-shadow:0 3px 0 #b55a00;font-family:inherit;position:relative;overflow:hidden}
.buy:disabled{filter:grayscale(1);opacity:.55}
.buy:not(:disabled)::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,#fff0,#fff9,#fff0);animation:sn 2.2s infinite}
@keyframes sn{to{left:130%}}
.toast{text-align:center;font-weight:900;background:linear-gradient(#3fb23f,#1d7a1d);border-radius:12px;padding:8px;margin:6px 0;box-shadow:0 3px 0 #0006;animation:pop .3s}
.row2{display:flex;align-items:center;gap:10px;background:linear-gradient(#5a3a1e,#38220f);border:2px solid #c8923f;border-radius:14px;padding:8px;margin:8px 0;box-shadow:0 4px 0 #0006}
.row2 .ic{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(#ffe98a,#e29a1d);box-shadow:inset 0 2px 0 #fff8,0 3px 0 #0005;flex:none}
.row2 .tx{flex:1}.row2 .buy{width:108px;flex:none}
.paper{position:relative}
.paper svg>rect,.paper svg .cl{pointer-events:none}
.mbd{position:absolute;inset:0;z-index:4}
.mnu{position:absolute;z-index:5;background:linear-gradient(#fff6d6,#f1d99a);color:#4a3300;border:3px solid #6b4423;border-radius:14px;padding:8px;width:176px;box-shadow:0 6px 0 #0006;display:flex;flex-direction:column;gap:6px;text-align:center}
.mnu b{font-size:16px}
.dfb{border:0;border-radius:10px;padding:6px;font-weight:900;font-size:15px;font-family:inherit;color:#fff;text-shadow:0 2px 0 #0006;box-shadow:0 3px 0 #0006}
.dfb small{display:block;font-size:10px;font-weight:bold;opacity:.9}
.dfb.d1{background:linear-gradient(#5fd35f,#2a9a2a)}.dfb.d2{background:linear-gradient(#ffb84a,#e07a00)}.dfb.d3{background:linear-gradient(#ff6a5a,#c01f1f)}
.dfb:disabled{filter:grayscale(1);opacity:.55}
</style></head><body><div id="app">
<div class="top"><div class="pill" id="coins"></div><div class="pill" id="gems"></div></div>
<div id="main"></div>
<div class="nav"><button data-t="map">🗺️ Mapa</button><button data-t="cards">🃏 Karty</button><button data-t="quests">📜 Úkoly</button><button data-t="shop">🛒 Shop</button></div>
</div>
<script>
const BASE={beaver:{n:'Mushy beaver',e:'🦫',d:50,h:150,cd:1.6},bear:{n:'Mushy bear',e:'🐻',d:60,h:210,cd:2.4},wolf:{n:'Mushy wolf',e:'🐺',d:120,h:80,cd:3.2},fox:{n:'Mushy fox',e:'🦊',d:80,h:120,cd:2.2},boar:{n:'Mushy boar',e:'🐗',d:45,h:260,cd:2.6},owl:{n:'Mushy owl',e:'🦉',d:90,h:100,cd:2.5},deer:{n:'Mushy deer',e:'🦌',d:70,h:180,cd:2.8},mage:{n:'Frozen mage',e:'🧙',d:65,h:250,cd:2.4},bolet:{n:'Frosted boletus',e:'🍄',d:30,h:350,cd:1.6},puff:{n:'Frosted puffball',e:'☃️',d:90,h:150,cd:2.6},parasol:{n:'Parasol mushroom',e:'🍄',d:75,h:250,cd:2.5},suil:{n:'Iced suillus',e:'🐌',d:80,h:195,cd:2.5},skeleton:{n:'Mushy skeleton',e:'💀',d:120,h:250,cd:2.8},zombie:{n:'Mushy zombie',e:'🧟',d:95,h:320,cd:2.6},ghost:{n:'Mushy ghost',e:'👻',d:150,h:240,cd:3,dodge:.2},wither:{n:'Mushy wither',e:'🥀',d:300,h:1,cd:3.2},kingz:{n:'King zombie',e:'👑',d:65,h:750,cd:1.8},sheriff:{n:'Sheriff mush',e:'🤠',d:0,h:500,cd:1.6},citizen:{n:'Citizen mush',e:'🧑‍🌾',d:35,h:250,cd:1.6},mailman:{n:'Mailman mush',e:'📮',d:50,h:320,cd:2.4,hits:2},medic:{n:'Medic mush',e:'🩺',d:0,h:150,cd:2,heal:45},kingm:{n:'King mush',e:'🤴',d:125,h:850,cd:2.8}};
const IDS=Object.keys(BASE);
const DIF={1:{dm:1,hm:1,rw:1},2:{dm:1.2,hm:1,rw:1.2},3:{dm:1.2,hm:1.5,rw:1.6}};let curDif=1,MN=null;
const BOSS={boss1:{n:'Forest Guardian',e:'🌳',d:75,h:800,cd:2.4,boss:1,rc:150,rg:5},boss2:{n:'Frost Giant',e:'🥶',d:100,h:1100,cd:2.6,boss:1,rc:200,rg:10},boss3:{n:'Dark Lord',e:'😈',d:160,h:1500,cd:2.8,boss:1,rc:250,rg:15},boss4:{n:'Emperor Mush',e:'👹',d:170,h:2200,cd:2.8,boss:1,rc:300,rg:20}};
const BOSSL=Object.keys(BOSS);Object.assign(BASE,BOSS);
const bossFor=st=>st%10==0?BOSSL[Math.min(st/10-1,3)]:null;
const BIOMES=[['Forest','#a6f08a'],['Icy Meadows','#d4f1f9'],['Dark Forest','#7fae86'],['Village','#ecdcae'],['Snow','#e3f2fd'],['Volcano','#f0a58a']];
const dp=n=>n<=3?5:n<=7?10:n<=10?15:n<=14?30:50, hp=n=>n<=3?0:n<=7?5:n<=10?10:n<=14?25:50, cost=n=>n<=3?30:n<=7?50:n<=10?70:n<=14?100:200, ccost=n=>n<=3?50:n<=7?100:n<=10?200:n<=14?400:800;
const DAY=864e5;
let S={coins:0,gems:0,wins:0,c:{beaver:{o:1,l:1,n:0},bear:{o:0,l:1,n:0},wolf:{o:0,l:1,n:0}},t:{},boost:0};
try{const x=localStorage.getItem('mushy');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('mushy',JSON.stringify(S))}catch(e){}};
if(!S.tut&&S.wins>0)S.tut=1;
IDS.forEach((id,k)=>{if(!S.c[id])S.c[id]={o:0,l:1,n:0};if(k<3)S.c[id].o=1});
const FP=['fox','boar','owl','deer'],ICY=['mage','bolet','puff','parasol','suil'],DARK=['skeleton','zombie','ghost','wither','kingz'],VIL=['sheriff','citizen','mailman','medic','kingm'],BIO_POOL=[['beaver','bear','wolf'],ICY,DARK,VIL];
function unlock(){[[10,ICY.slice(0,3)],[20,DARK.slice(0,4)],[30,VIL.slice(0,4)]].forEach(([w,l])=>{if(S.wins>=w)l.forEach(x=>S.c[x].o=1)})}
const $=id=>document.getElementById(id);
let tab='map',B=null,msg='',PB=null;
function mult(id){let d=1,h=1;for(let n=2;n<=S.c[id].l;n++){d+=dp(n)/100;h+=hp(n)/100}return[d,h]}
function hud(){const qb=document.querySelector('[data-t=quests]');if(qb)qb.textContent='📜 Úkoly'+(qReady()?' ❗':'');$('coins').textContent='🪙 '+S.coins+(S.boost>Date.now()?'  ×2':'');$('gems').textContent='💎 '+S.gems}
function go(t){mpClose();tab=t;B=null;PB=null;MN=null;render()}
document.querySelectorAll('.nav button').forEach(b=>{b.onclick=()=>go(b.dataset.t)});
function render(){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab&&!B));
  unlock();hud();const m=$('main');m.style.background='';
  if(B)return battleUI();if(PB)return preUI();if(MP)return mpUI();
  if(tab=='map')mapUI(m);else if(tab=='cards')cardsUI(m);else if(tab=='quests')questsUI(m);else shopUI(m);
}
function mnuH(pts,pos,base){if(MN==null||MN>pos)return '';const s2=base+MN+1,bt=Math.max((S.dif||{})[s2]||0,s2<=S.wins?1:0),p=pts[MN],nm=['','Easy','Medium','Hard'],inf=['','základní','⚔️×1.2 · 🪙×1.2','❤️×1.5 ⚔️×1.2 · 🪙×1.6'];
 return `<div class="mbd" data-close="1"></div><div class="mnu" style="left:${(p[0]/3.6).toFixed(1)}%;top:${(p[1]/5.4).toFixed(1)}%;transform:translate(-50%,${MN>=6?'12px':'calc(-100% - 70px)'})"><b>Stage ${s2}</b>${[1,2,3].map(k=>{const ok=k<=bt+1;return `<button class="dfb d${k}" ${ok?`data-dif="${k}" data-st="${s2}"`:'disabled'}>${ok?(bt>=k?'✓ ':''):'🔒 '}${nm[k]}<small>${inf[k]}</small></button>`}).join('')}</div>`}
function mapUI(m){
  const st=S.wins+1,bi=Math.floor((st-1)/10)%BIOMES.length,pos=(st-1)%10,bm=BIOMES[bi],tu=!S.tut,bid=bossFor(st);
  const D=[['🌲','🌳','🍄','🌼','🪨'],['🎄','🌲','⛄','❄️','🧊'],['🪦','🌲','💀','🦇','⚰️'],['🏠','🌳','🧺','🌻','🪵']][bi%4];
  const pts=[];for(let i=0;i<10;i++)pts.push([180+105*Math.sin(i*1.15),500-i*50]);
  const P=a=>'M'+a.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' L'),full=P(pts),part=P(pts.slice(0,pos+1));
  let pins='';const base=Math.floor((st-1)/10)*10;
  pts.forEach((p,i)=>{const dn=i<pos,cur=i==pos,bs=i==9,col=dn?'#2db84b':cur?'#ffcf00':bs?'#e04040':'#9a9a9a';
    pins+=`<g ${i<=pos&&!tu?`data-pin="${i}" style="cursor:pointer"`:''} filter="url(#sh)" transform="translate(${p[0].toFixed(1)},${p[1].toFixed(1)}) scale(${bs?1.3:1})">${cur?'<circle class="pulse" cy="-4" r="16" fill="#ffcf00"/>':''}<ellipse cy="2" rx="12" ry="4" fill="#0004"/><path d="M0 0 C-22 -22 -18 -44 0 -44 C18 -44 22 -22 0 0Z" fill="${col}" stroke="#fff" stroke-width="3"/><circle cy="-28" r="11" fill="#fff" opacity=".9"/><text y="-23" text-anchor="middle" font-size="15" font-weight="900" fill="${dn?'#2db84b':'#333'}">${dn?'✓':(bs?'👑':(cur&&tu?'0':(Math.floor((st-1)/10)*10+i+1)))}</text>${cur?'<text class="bob" y="-58" text-anchor="middle" font-size="32">🍄</text>':''}</g>`});
  const dec=[[30,70,0],[300,150,1],[40,330,0],[312,420,1],[62,190,2],[292,290,3],[70,455,4],[250,62,0],[322,510,0],[40,515,1],[110,380,3],[250,230,4],[20,230,3],[330,330,2]].map(d=>`<text x="${d[0]}" y="${d[1]}" font-size="${28+(d[0]*7%9)}" filter="url(#sh)">${D[d[2]]}</text>`).join('');
  const menu=mnuH(pts,pos,base);m.innerHTML=`<div class="stage">Stage ${tu?0:st}<small>${tu?'📖 Tutoriál · 3 karty proti 3 · výhra +100 🪙':bid?`👑 BOSS: ${BASE[bid].n} · výhra +${BASE[bid].rc} 🪙 +${BASE[bid].rg} 💎`:`${bm[0]} · boj ${pos+1}/10 · výhra +50 🪙`}</small></div>
  <div class="paper"><svg viewBox="0 0 360 540" width="100%" style="display:block"><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity=".4"/></filter><pattern id="gr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".3"/></pattern><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient><radialGradient id="hl"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><radialGradient id="vg"><stop offset="60%" stop-color="#0000"/><stop offset="100%" stop-color="#0006"/></radialGradient></defs>
  <rect width="360" height="540" fill="${bm[1]}"/><rect width="360" height="540" fill="url(#gd)"/><rect width="360" height="540" fill="url(#gr)"/>
  <ellipse cx="60" cy="130" rx="90" ry="45" fill="url(#hl)"/><ellipse cx="300" cy="370" rx="95" ry="55" fill="url(#hl)"/><ellipse cx="170" cy="260" rx="60" ry="30" fill="url(#hl)"/>
  <ellipse cx="85" cy="300" rx="44" ry="22" fill="#6ec6ee" stroke="#fff" stroke-width="3" opacity=".9"/><path d="M62 300q8-6 16 0t16 0" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/>
  ${dec}
