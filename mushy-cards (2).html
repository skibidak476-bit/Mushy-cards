function mk(id,side,st){
  const b=BASE[id];let d=1,h=1;

  if(MOD&&MOD.id=='fury')d*=1.3;
  const mx=Math.round(b.h*h);return{id,side,dmg:Math.round(b.d*d),max:mx,hp:mx,ct:b.cd>=2.4?1:0,w:0,hit:0,dodge:(b.dodge||0)+(MOD&&MOD.id=='fog'?.15:0),sh:b.ab=='shield'?Math.round(mx*b.ap):0,psn:0,pd:0}
}
function team(side,st){

  for(let i=0;i<6;i++)u.push(mk(side=='p'?ids[i%ids.length]:(pl=>pl[Math.floor(Math.random()*pl.length)])(BIO_POOL[Math.min(Math.floor((st-1)/10),3)]),side,st));
  return{u,slot:[0,1,2],rot:Date.now()+7000}
}

function team2(side,st,types,nr){return{u:types.map(x=>mk(x,side,st)),slot:[0,1,2],rot:Date.now()+7000,types:types.filter(x=>!BASE[x].boss),lost:0,side,st,nr}}

let MP=null;
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))),dcd=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/\s/g,'')))));
const mpSend=o=>{if(MP&&MP.ch&&MP.ch.readyState=='open')MP.ch.send(JSON.stringify(o))};
function mpClose(){if(MP){try{MP.pc&&MP.pc.close()}catch(e){}MP=null}}
function mkPC(){try{return new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]})}catch(e){return new RTCPeerConnection()}}
function mpNew(role){MP={role,st:'',sel:[],s:null,pc:mkPC()};
 MP.pc.onconnectionstatechange=()=>{if(MP&&['failed','closed','disconnected'].includes(MP.pc.connectionState)&&MP.st!='end'&&MP.st!='menu'){MP.st='lost';mpUI()}}}
const gather=pc=>new Promise(r=>{if(pc.iceGatheringState=='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState=='complete'&&r();setTimeout(r,3500)});
function wire(ch){MP.ch=ch;ch.onopen=()=>{SFX('connect');MP.st='pick';mpUI()};ch.onmessage=e=>mpMsg(JSON.parse(e.data))}
async function mpHost(){try{await mpHost2()}catch(e){MP={st:'menu',err:'Chyba: '+(e&&e.message||e)};mpUI()}}
async function mpHost2(){mpNew('h');MP.st='gen';mpUI();wire(MP.pc.createDataChannel('g'));await MP.pc.setLocalDescription(await MP.pc.createOffer());await gather(MP.pc);MP.code=enc(MP.pc.localDescription);MP.st='offer';mpUI()}
async function mpJoin(c){try{const d=dcd(c);mpNew('g');MP.st='gen';MP.pc.ondatachannel=e=>wire(e.channel);await MP.pc.setRemoteDescription(d);await MP.pc.setLocalDescription(await MP.pc.createAnswer());await gather(MP.pc);MP.code=enc(MP.pc.localDescription);MP.st='answer'}catch(e){MP={st:'menu',err:'Chyba: '+(e&&e.message||'neplatný kód')}}mpUI()}
async function mpFinish(c){try{await MP.pc.setRemoteDescription(dcd(c))}catch(e){MP.err='Neplatný kód'}mpUI()}
function mpMsg(m){
 if(m.t=='units'){MP.gu=m.u;mpTry()}
 else if(m.t=='state'){const gm=m.G.msg||'';SFX(/léčí/.test(gm)?'heal':/MISS/.test(gm)?'miss':'hit');if(!m.G.end&&m.G.turn==MP.role)setTimeout(()=>SFX('turn'),300);MP.G=m.G;MP.st=m.G.end?'end':'fight';mpUI()}
 else if(m.t=='act')mpAct('g',m.a,m.x);

function mpTry(){if(MP.role!='h'||!MP.hu||!MP.gu)return;MP.G={h:{u:MP.hu,slot:[0,1,2]},g:{u:MP.gu,slot:[0,1,2]},turn:'h',end:0,msg:'Začíná host'};MP.st='fight';mpSend({t:'state',G:MP.G});mpUI()}
function mpAct(r,a,x,pass){const G=MP.G;if(!G||G.end||G.turn!=r)return;const o=r=='h'?'g':'h',me=G[r],op=G[o];let txt='přeskočil tah';
 if(!pass){const A=me.u[a];if(!A||A.hp<=0||A.w>0)return;const b=BASE[A.id];
  if(b.heal){const T=me.u[x];if(!T||T.hp<=0||T.hp>=T.max)return;T.hp=Math.min(T.max,T.hp+b.heal);SFX('heal');txt=b.e+' léčí +'+b.heal}
  else if(b.d>0){const T=op.u[x];if(!T||T.hp<=0)return;const bf=A.id!='sheriff'&&me.slot.some(i=>me.u[i].id=='sheriff'&&me.u[i].hp>0)?1.25:1;let d=0;for(let k=0;k<(b.hits||1);k++)if(Math.random()>=(T.dodge||0))d+=Math.round((A.hp/A.max<.55?A.dmg/2:A.dmg)*bf);T.hp-=d;SFX(d?'hit':'miss');txt=b.e+' → '+BASE[T.id].e+(d?' −'+d:' MISS')}
  else return;A.w=A.ct+1}
 [me,op].forEach(T=>{T.slot=T.slot.map(i=>{if(T.u[i].hp>0)return i;const q=T.u.map((_,k)=>k).filter(k=>T.u[k].hp>0&&!T.slot.includes(k));return q.length?q[0]:-1}).filter(i=>i>=0)});
 if(!op.slot.length)G.end=r;else if(!me.slot.length)G.end=o;else{G.turn=o;G[o].u.forEach(u=>{if(u.w>0)u.w--})}
 if(!G.end&&G.turn=='h'&&r=='g')setTimeout(()=>SFX('turn'),300);G.msg=(r=='h'?'Host: ':'Hráč 2: ')+txt;G.n=(G.n||0)+1;mpSend({t:'state',G});if(G.end)MP.st='end';mpUI()}

    if(sb&&sb.heal&&B.P.u[B.sel].w<=0){const t=B.P.u[i];if(t.hp>0&&t.hp<t.max){heal(B.P.u[B.sel],t);B.sel=null;B.note='';after();if(B.end)return battleUI();B.turn='e';battleUI();setTimeout(botTurn,900);return}}
    const b=BASE[B.P.u[i].id];if(B.P.u[i].w<=0&&(b.d>0||b.heal)){SFX('pick');B.sel=i;battleUI()}});
  m.querySelectorAll('[data-e]').forEach(e=>e.onpointerdown=()=>{
    if(B.end||B.turn!='p'||B.sel==null)return;const a=B.P.u[B.sel],t=B.E.u[+e.dataset.e];if(a.w>0||t.hp<=0)return;hit(a,t);B.sel=null;B.note='';after();if(B.end)return battleUI();B.turn='e';battleUI();setTimeout(botTurn,900)});
  const sk=$('skip');if(sk)sk.onclick=()=>{B.sel=null;B.turn='e';battleUI();setTimeout(botTurn,900)};const bk=$('back');if(bk)bk.onclick=()=>{B=null;go('map')};
}
setInterval(()=>{if(!B&&tab=='shop')render();else hud()},30000);
ffInit();render();
</script></body></html>
